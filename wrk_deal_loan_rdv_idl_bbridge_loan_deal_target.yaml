      - id: db_prepare_data_pr3
        type: ceh_core_idl.app.operators.etl.create_sql_proc_operator
        description: Добавление суррогатного ключа deal_target_rk
        properties:
          sql_select_statement: |
            select
              b.deal_target_rk,
              a.deal_target_id,
              a.deal_rk,
              a.deal_id,
              a.tgt_deal_rk,
              a.deal_target_sum,
              a.currency_rk,
              a.department_rk,
              a.loan_target_type_name,
              a.loan_target_type_cd,
              a.main_deal_target_flg,
              a.okved_cd,
              a.effective_from_date,
              a.effective_to_date,
              a.deleted_flg
            from stg.t_zk1_${load_id} as a
            join stg.t_prep2_${load_id} as b 
                 on a.deal_target_id = b.deal_target_id
          analyze_flg: true
          result_dataset:
            schema: stg
            name: t_prep3_${load_id}
            physical_options:
              materialize_flg: true
              distribute_type: column
              distribute_keys:
