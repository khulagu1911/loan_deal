      - id: update_resource_state_sal_deal_target_ppkc
        type: ceh_core_idl.app.operators.services.reg_delta_operator
        description: Обновление состояния ресурса
        properties:
          transaction_uid: ${open_transaction.result.transaction_uid}
          common_version_id: ${common_version_id}
          target_resource_cd: ${target_resource_name_sal_deal_target_ppkc}
          target_dataset:
            name: sal_deal_target
            schema: idl
          load_id: ${load_id_sal_deal_target_2}
          delta_dataset: ${load_dummy_sal_deal_target.result_dataset}
          algorithm_uid: ${algorithm_uid}
        sequencer:
          dependencies:
            - ref: load_dummy_sal_deal_target
      - id: commit
        type: ceh_core_libs.steps.services.commit_transaction_step
        description: Коммит операция
        properties:
          transaction_uid: ${open_transaction.result.transaction_uid}
          transaction_token: ${open_transaction.result.transaction_token}
        sequencer:
          dependencies:
            - ref: update_resource_state_sal_deal_target_ppkc
      - id: rollback
        type: ceh_core_libs.steps.services.rollback_transaction_step
        description: Ролбэк операция
        properties:
          transaction_uid: ${open_transaction.result.transaction_uid}
          transaction_token: ${open_transaction.result.transaction_token}
        sequencer:
          dependencies:
            - ref: open_transaction
            - ref: error_occurred
      - id: error_occurred
        type: ceh_core_libs.steps.core.dummy_step
        description: Пустой шаг, для логического разделения блоков
        sequencer:
          dependencies:
            - ref: update_resource_state_sal_deal_target_ppkc
              condition: ${not update_resource_state_sal_deal_target_ppkc.status}
          condition: any
      - id: check_new_key_sal_deal_target
        type: ceh_core_idl.app.operators.etl.check_new_key_operator
        description: Получение флага наличия новых ключей в исходном
        properties:
          source_dataset:
            name: t_st_${fin_load_id}
            schema: stg
            business_keys:
              - deal_target_rk
          target_dataset:
            name: sal_deal_target
            schema: idl
            business_keys:
              - secondary_rk
          same_link_dataset:
            schema: null
      - id: dummy_step_sal_deal_target_ppkc
        type: ceh_core_libs.steps.core.dummy_step
        description: Пустой шаг, для логического разделения блоков
        sequencer:
          dependencies:
            - ref: check_new_key_sal_deal_target
              condition: check_new_key_sal_deal_target.result.check_flag
          condition: any
      - id: wait_for_delta
        type: ceh_core_libs.steps.services.wait_delta_step
        description: Степ ожидания наката дельты
        properties:
          current_version_id: ${block_resources.result.version_id}
        sequencer:
          dependencies:
            - ref: commit
      - id: dummy_step
        type: ceh_core_libs.steps.core.dummy_step
        description: Пустой шаг, для логического разделения блоков
        sequencer:
          dependencies:
            - ref: wait_for_delta
            - ref: rollback
          condition: ${(wait_for_delta.status or wait_for_delta.status is none) and
            rollback.status is none}
          on_false_condition: fail


