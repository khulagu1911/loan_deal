            history_type: full
            main_join_columns:
              - loan_target_type_cd
            slave_join_columns:
              - ltt_cd
            join_type: left
            final_expression: deal_target_id, deal_rk, deal_id, deal_target_sum, currency_rk, department_rk, t1.loan_target_type_cd,
              main_deal_target_flg, okved_cd,deleted_flg, loan_target_type_name
          result_dataset:
