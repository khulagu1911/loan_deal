      - id: db_prepare_data_pr1
        type: ceh_core_idl.app.operators.etl.create_sql_proc_operator
        description: Объединяем инкремент и снепшот
        properties:
          sql_select_statement: |
            select distinct 
              deal_target_id 
              , 'BK-idl-deal_target-deal_target_seq-LOAN'::text as bk_schema_cd
              , 'LOAN'::text as src_cd
              , deleted_flg
            from stg.t_pr5_${load_id}
            where deal_target_id is not null
          analyze_flg: true
          result_dataset:
